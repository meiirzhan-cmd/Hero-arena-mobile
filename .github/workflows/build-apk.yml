name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hero-arena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hero-arena-apk
          path: hero-arena.apk

      # A release gives the phone a direct .apk download link, with no zip and no sign-in.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hero Arena build ${{ github.run_number }}
          body: Debug build for testing. Download hero-arena.apk below and open it on your phone.
          files: hero-arena.apk
          make_latest: true
