<style>
:root{
  /* Sticker brawl on a cutting mat: deep green grid, die-cut white-edged stickers, yellow corner against pink corner. */
  --mat:#17614f;
  --mat-line:#2c8a72;
  --ink:#0d1c17;
  --ink-2:#1c3029;
  --paper:#f6f8f1;
  --p1:#ffcf33;
  --p2:#ff6b9a;
  --muted:#a9c9bd;
  --font-display:"Bowlby One","Dela Gothic One","Arial Black",Impact,sans-serif;
  --font-body:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.35;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--p1);outline-offset:2px}

.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.col{width:min(100%,480px);margin:0 auto;padding:0 16px}

/* buttons */
.btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:11px 16px;text-align:left;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink),0 5px 0 2px rgba(255,255,255,.12)}
.btn b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
.btn span{font-size:14px;opacity:.75}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.p1{background:var(--p1)}
.btn.p2{background:var(--p2)}
.btn.center{align-items:center;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.ghost{background:none;border:2px solid var(--muted);color:var(--paper);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500}
.ghost:active{background:rgba(255,255,255,.12)}

/* home */
#home{pointer-events:none}
#home > *{pointer-events:auto}
#home-top{padding-top:18px;padding-bottom:10px;text-align:center}
#home-top h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,13.5vw,62px);line-height:.95;letter-spacing:1px;
  text-transform:uppercase;color:var(--paper);transform:rotate(-3deg);text-shadow:0 4px 0 var(--p2),0 8px 0 var(--ink)}
#home-top h1 i{font-style:normal;color:var(--p1)}
#home-top p{margin:16px 0 0;color:var(--muted);font-size:15px}
#home .gap{flex:1;pointer-events:none}
#home-bottom{display:flex;flex-direction:column;gap:11px;padding-top:12px;padding-bottom:16px}
#home-bottom .row{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:2px}
.lang{display:flex;border:2px solid var(--muted);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:8px 14px;font-size:14px;font-weight:700;color:var(--paper)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
#cam{background:#000}
#cam-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cam-video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.cam-top{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:center}
.cam-top p{margin:0;max-width:420px;background:rgba(13,28,23,.82);padding:9px 14px;border-radius:12px;font-weight:500;text-align:center}
.cam-zoom{position:absolute;left:24px;right:24px;bottom:122px}
.cam-zoom input{width:100%;accent-color:var(--p1)}
.cam-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65))}
.cam-bar .ghost{background:rgba(13,28,23,.8);min-width:100px}
#cam-shot{flex:none;width:76px;height:76px;border-radius:50%;padding:0;background:var(--paper);border:5px solid var(--p1);box-shadow:0 0 0 4px var(--ink);font-size:34px;font-weight:700;color:var(--ink);line-height:1}
#cam-shot:active{transform:scale(.94)}
#cam-shot[disabled]{opacity:.4}
.inv{visibility:hidden}
.cam-msg{position:absolute;left:24px;right:24px;top:40%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cam-msg p{margin:0;max-width:340px;background:rgba(13,28,23,.9);padding:12px 16px;border-radius:12px}

/* shared sheet screens */
.sheet{background:rgba(13,28,23,.95)}
.band{flex:none;padding:14px 0 12px;border-bottom:3px solid var(--ink);background:var(--p1);color:var(--ink)}
.band.two{background:var(--p2)}
.band h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.1;text-transform:uppercase;text-wrap:balance}
.band p{margin:3px 0 0;font-size:14px;opacity:.8}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 18px}
.foot{flex:none;background:var(--ink-2);border-top:3px solid var(--ink);padding:12px 0 14px}

/* pick grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;min-height:118px;
  background:var(--ink-2);border:3px solid transparent;border-radius:14px;color:var(--paper)}
.card canvas{width:72px;height:72px}
.card b{font-size:13.5px;font-weight:700;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.card small{font-size:12px;color:var(--muted)}
.card.sel{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--pick,var(--p1))}
.card.sel small{color:#3d564d}
.card.new{border:3px dashed var(--muted);justify-content:center}
.card.new .plus{font-family:var(--font-display);font-size:34px;line-height:1;color:var(--p1)}

#detail{display:flex;gap:12px;align-items:flex-start;min-height:92px}
#detail canvas{width:64px;height:64px;flex:none}
#detail .txt{flex:1;min-width:0}
#detail h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:18px;text-transform:uppercase;overflow-wrap:anywhere}
#detail .meta{font-size:13px;color:var(--muted);margin:1px 0 5px}
#detail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
#detail ul b{font-weight:700}
.actions{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.actions .ghost{flex:none}
.actions .btn{flex:1;padding:9px 14px}
.actions .btn b{font-size:17px}

/* creator */
.field{margin-bottom:18px}
.field > label,.field > .lab{display:block;font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;color:var(--p1)}
.field .hint{font-size:13px;color:var(--muted);margin:-3px 0 8px}
#c-name{width:100%;padding:11px 13px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;
  -webkit-user-select:text;user-select:text}
.picrow{display:flex;gap:14px;align-items:flex-start}
#c-prev{width:150px;height:230px;flex:none;border-radius:14px;background:var(--ink-2);touch-action:none}
.picrow .side{flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.faces button{width:38px;height:38px;font-size:21px;line-height:1;background:var(--ink-2);border:2px solid transparent;border-radius:10px;padding:0}
.faces button.sel{border-color:var(--p1);background:#2a4037}
.shapes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.shapes button{display:flex;align-items:center;gap:10px;padding:10px;text-align:left;background:var(--ink-2);border:3px solid transparent;border-radius:12px;color:var(--paper)}
.shapes button.sel{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--p1)}
.shapes b{font-size:14px}
.shapes small{font-size:12px;opacity:.8;line-height:1.2}

.power .ico{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:25px;line-height:1}

.power .t{min-width:0}
.power .t b{display:block;font-size:14.5px}
.power .t small{display:block;font-size:12.5px;color:var(--muted);line-height:1.25}

.power.sel .t small{color:#3d564d}
.power .pic{display:none;flex:none;width:74px;padding:4px;font-size:12px;line-height:1.15;font-weight:500;background:none;border:2px dashed var(--muted);border-radius:12px;color:var(--paper)}
.power.sel .pic{display:block}
.step{display:none}
.step.on{display:block}
.ghost.sm{padding:6px 12px;font-size:13px}
.mini{display:flex;gap:8px;margin-top:8px}

#c-zoomwrap label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}

.side .hint{margin:0}

.ppic .t{flex:1;min-width:0}
.ppic .t b{display:block;font-size:15px}
.ppic .t small{display:block;font-size:13px;color:var(--muted)}
.ppic .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* battle chrome */
#battle{pointer-events:none}
#pause{pointer-events:auto;position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:44px;padding:0;
  background:rgba(13,28,23,.82);border:2px solid var(--muted);border-radius:10px;color:var(--paper);font-weight:700;font-size:13px;letter-spacing:1px}

  display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.35)}

<body>
<canvas id="game" aria-label="Hero Arena fight"></canvas>

<section id="home" class="screen on">
  <header id="home-top" class="col">
    <h1>Hero <i>Arena</i></h1>
    <p data-t="tagline"></p>
  </header>
  <div class="gap"></div>
  <nav id="home-bottom" class="col">
    <button class="btn p1" data-mode="1p"><b data-t="solo_t"></b><span data-t="solo_s"></span></button>
    <button class="btn p2" data-mode="2p"><b data-t="two_t"></b><span data-t="two_s"></span></button>
    <button class="btn" data-mode="watch"><b data-t="watch_t"></b><span data-t="watch_s"></span></button>
    <div class="row"><button class="ghost" id="snd-home"></button><div class="lang" role="group" data-t-aria="language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div></div>
  </nav>
</section>

<section id="pick" class="screen sheet">
  <div class="band" id="pick-band"><div class="col"><h2 id="pick-title">Pick your fighter</h2><p id="pick-sub"></p></div></div>
  <div class="scroll"><div class="col"><div class="grid" id="pick-grid"></div></div></div>
  <div class="foot"><div class="col">
    <div id="detail"></div>
    <div class="actions">
      <button class="ghost" id="pick-back" data-t="back"></button>
      <button class="btn p1 center" id="pick-ok" disabled><b>Tap a fighter</b></button>
    </div>
  </div></div>
</section>

<section id="create" class="screen sheet">
  <div class="band"><div class="col"><h2 id="c-title">Make your own fighter</h2><p id="c-sub">Step 1 of 3. Shape and picture.</p></div></div>
  <div class="scroll"><div class="col">
    <div class="step on" id="c-s1">
      <div class="field">
        <label for="c-name" data-t="name"></label>
        <input id="c-name" type="text" maxlength="16" data-t-ph="name_ph" autocomplete="off">
      </div>
      <div class="field">
        <span class="lab" data-t="body_shape"></span>
        <p class="hint" data-t="shape_hint"></p>
        <div class="shapes" id="c-shapes"></div>
      </div>
      <div class="field">
        <span class="lab" data-t="picture"></span>
        <div class="picrow">
          <canvas id="c-prev" width="300" height="460" data-id="draft" aria-label="Fighter preview. Drag to move the photo inside the outline."></canvas>
          <div class="side">
            <button class="ghost" id="c-cam" type="button">Open camera</button>
            <button class="ghost" id="c-up" type="button" data-t="choose"></button>
            <button class="ghost hide" id="c-rm" type="button" data-t="remove"></button>
            <div id="c-zoomwrap" class="hide"><label for="c-zoom" data-t="zoom"></label><input id="c-zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
            <p class="hint" id="c-pichint"></p>
            <div class="faces" id="c-faces"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="step" id="c-s2">
      <div class="field">
        <span class="lab" id="c-plab">Powers: pick 2</span>
        <p class="hint" data-t="powers_hint"></p>
        <div class="powers" id="c-powers"></div>
      </div>
    </div>
    <div class="step" id="c-s3">
      <div class="field">
        <span class="lab" data-t="ppics"></span>
        <p class="hint" data-t="ppics_hint"></p>
        <div id="c-ppics"></div>
      </div>
    </div>
    <input id="f-cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="f-hero" type="file" accept="image/*" hidden>
    <input id="f-abil" type="file" accept="image/*" hidden>
  </div></div>
  <div class="foot"><div class="col">
    <p class="msg" id="c-msg" role="status"></p>
    <div class="actions" style="margin-top:0">
      <button class="ghost" id="c-back" type="button" data-t="back"></button>
      <button class="btn p1 center" id="c-save" type="button"><b>Next: powers</b></button>
    </div>
  </div></div>
</section>

<section id="battle" class="screen">
  <button id="pause" data-t-aria="pause">II</button>
</section>

<section id="cam" class="screen">
  <canvas id="cam-cv" aria-hidden="true"></canvas>
  <video id="cam-video" playsinline muted autoplay></video>
  <div class="cam-top"><p id="cam-hint" role="status"></p></div>
  <div class="cam-msg hide" id="cam-msg"><p id="cam-msgtext"></p><button class="btn p1 center" id="cam-app" type="button" style="width:auto"><b data-t="cam_app"></b></button></div>

  <div class="cam-bar">
    <button class="ghost" id="cam-cancel" type="button" data-t="cancel"></button>
    <button id="cam-shot" type="button"></button>
    <button class="ghost" id="cam-flip" type="button" data-t="cam_flip"></button>
  </div>
</section>

<section id="paused" class="screen modal">
  <div class="panel">
    <h2 data-t="paused"></h2>
    <button class="btn p1 center" id="p-resume"><b data-t="resume"></b></button>
    <button class="btn center" id="p-restart"><b data-t="restart"></b></button>
    <button class="btn center" id="p-quit"><b data-t="quit"></b></button>
    <div style="display:flex;justify-content:center"><button class="ghost" id="snd-pause"></button></div>
  </div>
</section>

<section id="result" class="screen modal">
  <div class="panel">
    <canvas id="r-pic" width="192" height="192"></canvas>
    <h2 id="r-title">Winner</h2>
    <p id="r-sub"></p>
    <button class="btn p1 center" id="r-again"><b data-t="again"></b></button>
    <button class="btn center" id="r-change"><b data-t="change"></b></button>
    <button class="btn center" id="r-home"><b data-t="menu"></b></button>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const INK = '#0d1c17', INK2 = '#1c3029', PAPER = '#f6f8f1', MUTED = '#a9c9bd', MAT = '#17614f', MATL = '#2c8a72';
const TEAM = ['#ffcf33', '#ff6b9a'];
const FONT_D = '"Bowlby One","Dela Gothic One","Arial Black",Impact,sans-serif';
const FONT_B = 'Rubik,system-ui,sans-serif';
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- data ---------- */
const SHAPES = {
  body:     { label: 'Full body', hp: 110, speed: 170, mass: 1.1, contact: 1.0, bounce: .75, blurb: 'Stands tall, all-rounder' },
  circle:   { label: 'Circle',   hp: 100, speed: 185, mass: 1.0, contact: 1.0, bounce: .92, blurb: 'Fast and bouncy' },
  square:   { label: 'Square',   hp: 135, speed: 150, mass: 1.7, contact: 1.1, bounce: .6,  blurb: 'Heavy, hard to push' },
  triangle: { label: 'Triangle', hp: 85,  speed: 170, mass: .9,  contact: 1.5, bounce: .8,  blurb: 'Spiky, bumps hurt more' }
};

// how far each sticker reaches from its centre, in body radii
const EXT = { body: { top: 1.75, bot: 1.25, hw: .72 }, circle: { top: 1, bot: 1, hw: 1 }, square: { top: .88, bot: .88, hw: .88 }, triangle: { top: 1.1, bot: .73, hw: 1.06 } };
function shapeBox(shape, R) {
  if (shape === 'body') return { x: -.75 * R, y: -1.75 * R, w: 1.5 * R, h: 3 * R };
  if (shape === 'triangle') return { x: -1.3 * R, y: -1.18 * R, w: 2.6 * R, h: 2.6 * R };
  return { x: -1.02 * R, y: -1.02 * R, w: 2.04 * R, h: 2.04 * R };
}

const ABILITIES = {
  pan: { name: 'Frying Pan Bonk', icon: '🍳', cd: 2.7, near: true, desc: 'Whack a close enemy across the mat.',
    ai: (h, e, d) => d < h.r + e.r + 30,
    use(h, e, ab) { const [ux, uy] = aim(h); h.swing = { t: 0, dur: .26, ang: Math.atan2(uy, ux), icon: ab.icon }; sfx('swish');
      if (e && dist(h, e) < h.r + e.r + 38) { hurt(e, 12, ux * 640, uy * 640, 'BONK!'); sfx('bonk'); } } },
  slipper: { name: 'Flying Slipper', icon: '🩴', cd: 1.7, desc: 'A homing slipper. It always finds its target.',
    ai: (h, e, d) => d < 330,
    use(h, e, ab) { shoot(h, ab, 0, { speed: 390, dmg: 9, kb: 230, homing: 1.7, life: 2.2, size: 26, spin: 14, word: 'SMACK!' }); } },
  dog: { name: 'Tiny Angry Dog', icon: '🐕', cd: 7.5, desc: 'Sends a small, furious dog to bite ankles.',
    ai: () => true,
    use(h, e, ab) { const [ux, uy] = aim(h); G.pets.push({ x: h.x + ux * h.r, y: h.y + uy * h.r, vx: ux * 200, vy: uy * 200, r: 12, team: h.team, life: 4.5, bite: .2, icon: ab.icon, first: false });
      text(h.x, h.y - h.top - 14, 'SIC ’EM!', PAPER, 15); sfx('yap'); } },
  slam: { name: 'Belly Slam', icon: '💨', cd: 5.5, desc: 'Charge at the enemy and flatten them.',
    ai: (h, e, d) => d > 70 && d < 250,
    use(h) { const [ux, uy] = aim(h); h.dash = .34; h.dx = ux; h.dy = uy; sfx('power'); } },
  disco: { name: 'Disco Fever', icon: '🕺', cd: 8, near: true, desc: 'Nearby enemies must stop and dance.',
    ai: (h, e, d) => d < 125,
    use(h, e) { ring(h.x, h.y, 20, 150, '#ffe66d', .5, 8); ring(h.x, h.y, 10, 150, '#ff6b9a', .65, 5); ring(h.x, h.y, 0, 150, '#7fd8ff', .8, 4); sfx('power');
      if (e && dist(h, e) < 150 + e.r) { if (e.shield > 0) { text(e.x, e.y - e.top - 14, 'BLOCK', '#bfe9ff', 15); } else { hurt(e, 10, 0, 0, null, true); e.stun = 1.8; e.dance = 1.8; e.dash = 0; text(e.x, e.y - e.top - 16, 'DANCE!', '#ffe66d', 22); } } } },
  coffee: { name: 'Triple Espresso', icon: '☕', cd: 7, desc: 'Run much faster for 3 seconds, bump harder and heal a little.',
    ai: (h, e, d) => d > 90 || h.hp < h.maxHp * .8,
    use(h) { h.boost = 3; heal(h, 10); text(h.x, h.y - h.top - 14, 'ZOOM!', '#ffd9a0', 18); sfx('power'); } },
  banana: { name: 'Banana Peel', icon: '🍌', cd: 3, near: true, desc: 'Drop a peel. Whoever steps on it goes sliding.',
    ai: (h, e, d) => d < 170,
    use(h, e, ab) { const [ux, uy] = aim(h); const mine = G.traps.filter(t => t.team === h.team); if (mine.length >= 3) G.traps.splice(G.traps.indexOf(mine[0]), 1);
      G.traps.push({ x: clamp(h.x + ux * (h.r + 18), 14, L.W - 14), y: clamp(h.y + uy * (h.r + 18), 14, L.H - 14), team: h.team, arm: .35, life: 12, icon: ab.icon, rot: rand(TAU) }); sfx('shoot'); } },
  cheese: { name: 'Stinky Cheese', icon: '🧀', cd: 6.5, desc: 'Throw a cheese cloud that hurts and slows.',
    ai: (h, e, d) => d < 280,
    use(h, e, ab) { const tx = e ? clamp(e.x + e.vx * .35, 30, L.W - 30) : h.x, ty = e ? clamp(e.y + e.vy * .35, 30, L.H - 30) : h.y;
      G.zones.push({ x: tx, y: ty, fx: h.x, fy: h.y, r: 62, team: h.team, delay: .5, life: 4, tick: 0, icon: ab.icon, seed: rand(9) }); sfx('shoot'); } },
  pizza: { name: 'Pizza Shuriken', icon: '🍕', cd: 2.5, desc: 'Three fast slices in a spread.',
    ai: (h, e, d) => d < 300,
    use(h, e, ab) { for (const a of [-.28, 0, .28]) shoot(h, ab, a, { speed: 470, dmg: 6, kb: 120, life: 1.3, size: 22, spin: 18 }); } },
  soap: { name: 'Soap Bubble', icon: '🧼', cd: 8.5, desc: 'A bubble that blocks the next 15 damage.',
    ai: (h, e, d) => d < 160,
    use(h) { h.shield = 3.5; h.shieldHp = 15; sfx('block'); } },
  soup: { name: 'Grandma’s Soup', icon: '🍲', cd: 9, desc: 'Slurp back 18 health over 2 seconds.',
    ai: h => h.hp < h.maxHp - 20,
    use(h) { h.healT = 2; text(h.x, h.y - h.top - 14, 'MMM!', '#9dffb0', 18); sfx('power'); } },
  chicken: { name: 'Rubber Chicken', icon: '🐔', cd: 3.3, desc: 'A squeaky boomerang. It hits going out and coming back.',
    ai: (h, e, d) => d < 250,
    use(h, e, ab) { shoot(h, ab, 0, { speed: 430, dmg: 9, kb: 150, life: 2.6, size: 28, spin: 16, boom: true, word: 'SQUEAK!' }); } }
};


// Each power has an outline shaped like its action. A photo for that power is cut to this outline.
const P = {
  circ(c, x, y, r) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); c.closePath(); },
  ell(c, x, y, rx, ry) { c.moveTo(x + rx, y); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.closePath(); },
  rr(c, x, y, w, h, r) { c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r); c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r); c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath(); },
  poly(c, pts) { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
    if (a < 0) pts = pts.slice().reverse(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
};
const ASH = {
  pan:     { vw: 140, vh: 100, d(c) { P.circ(c, 50, 50, 46); P.rr(c, 86, 41, 52, 18, 9); } },
  slipper: { vw: 72,  vh: 132, d(c) { P.ell(c, 36, 38, 31, 35); P.ell(c, 36, 100, 25, 30); P.poly(c, [[6, 40], [66, 40], [61, 100], [11, 100]]); } },
  dog:     { vw: 150, vh: 104, d(c) { P.ell(c, 68, 56, 44, 22); P.circ(c, 118, 36, 21); P.ell(c, 136, 44, 14, 10); P.poly(c, [[104, 26], [108, 2], [124, 20]]);
    P.rr(c, 34, 60, 11, 42, 5); P.rr(c, 54, 64, 11, 38, 5); P.rr(c, 82, 64, 11, 38, 5); P.rr(c, 100, 60, 11, 42, 5); P.poly(c, [[28, 50], [4, 24], [11, 19], [34, 43]]); } },
  slam:    { vw: 140, vh: 100, d(c) { P.circ(c, 94, 50, 44); P.poly(c, [[94, 8], [94, 92], [4, 68], [24, 50], [4, 32]]); } },
  disco:   { vw: 100, vh: 134, d(c) { P.rr(c, 47, 0, 6, 26, 2); P.rr(c, 35, 20, 30, 14, 4); P.circ(c, 50, 84, 47); } },
  coffee:  { vw: 132, vh: 112, d(c) { P.rr(c, 14, 14, 80, 82, 14); P.circ(c, 98, 52, 24); P.ell(c, 56, 100, 54, 10); } },
  banana:  { vw: 142, vh: 70,  d(c) { c.moveTo(6, 12); c.quadraticCurveTo(70, 118, 134, 10); c.lineTo(140, 2); c.lineTo(130, 0); c.quadraticCurveTo(70, 70, 14, 6); c.closePath(); } },
  cheese:  { vw: 130, vh: 90,  d(c) { P.poly(c, [[4, 40], [100, 4], [126, 40], [126, 86], [4, 86]]); } },
  pizza:   { vw: 112, vh: 122, d(c) { c.moveTo(56, 120); c.lineTo(4, 26); c.quadraticCurveTo(56, -8, 108, 26); c.closePath(); } },
  soap:    { vw: 124, vh: 112, d(c) { P.circ(c, 52, 60, 48); P.circ(c, 102, 28, 18); P.circ(c, 104, 88, 12); } },
  soup:    { vw: 132, vh: 106, d(c) { P.ell(c, 66, 40, 62, 13); c.moveTo(128, 40); c.arc(66, 40, 62, 0, Math.PI); c.closePath(); P.rr(c, 44, 95, 44, 10, 4); } },
  chicken: { vw: 96,  vh: 158, d(c) { P.circ(c, 46, 24, 17); P.poly(c, [[60, 18], [82, 25], [60, 32]]); P.circ(c, 40, 8, 6); P.circ(c, 51, 7, 6);
    P.rr(c, 38, 34, 16, 56, 8); P.ell(c, 46, 114, 32, 38); P.poly(c, [[34, 146], [28, 158], [42, 153]]); P.poly(c, [[56, 146], [52, 153], [66, 158]]); } }
};
// place a power outline in a box: returns the scale and top-left used
function ashFit(id, x, y, w, h) { const a = ASH[id], k = Math.min(w / a.vw, h / a.vh); return { k, x: x + (w - a.vw * k) / 2, y: y + (h - a.vh * k) / 2, w: a.vw * k, h: a.vh * k }; }
function ashPath(c, id, f) { c.save(); c.translate(f.x, f.y); c.scale(f.k, f.k); c.beginPath(); ASH[id].d(c); c.restore(); }
// photo cut to the power's outline, with a white sticker edge
function bakeAbil(src, id) {
  const N = 160, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d'), f = ashFit(id, 12, 12, N - 24, N - 24);
  x.lineJoin = 'round'; ashPath(x, id, f);
  x.lineWidth = 17; x.strokeStyle = INK; x.stroke(); x.lineWidth = 12; x.strokeStyle = '#fff'; x.stroke(); x.fillStyle = '#fff'; x.fill();
  x.save(); x.clip(); x.drawImage(src, f.x, f.y, f.w, f.h); x.restore();
  return c.toDataURL('image/png');
