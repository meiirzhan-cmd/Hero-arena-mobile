plugins {
    id 'com.android.application'
}

android {
    namespace 'com.heroarena.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.heroarena.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.3-prototype'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
